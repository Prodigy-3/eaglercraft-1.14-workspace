name: Build Fresh Client WASM Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build WASM-GC Client & EPW Assets
        run: ./gradlew :target_teavm_wasm_gc:makeMainWasmClientBundle -x test || ./gradlew :target_teavm_wasm_gc:teavm -x test

      - name: Bundle All Client Files
        run: |
          mkdir -p dist

          # Copy everything generated under target_teavm_wasm_gc
          cp -r target_teavm_wasm_gc/javascript_dist/* dist/ 2>/dev/null || true
          cp -r target_teavm_wasm_gc/javascript/* dist/ 2>/dev/null || true

          # Recursively pull all missing web assets and compiled binaries into dist
          find . -name "index.html" -exec cp {} dist/ \; 2>/dev/null || true
          find . -name "loader.js" -exec cp {} dist/ \; 2>/dev/null || true
          find . -name "*.wasm" -exec cp {} dist/ \; 2>/dev/null || true
          find . -name "*.js" -exec cp {} dist/ \; 2>/dev/null || true
          find . -name "*.epw" -exec cp {} dist/ \; 2>/dev/null || true
          find . -name "*.epk" -exec cp {} dist/ \; 2>/dev/null || true
          find . -name "*.png" -exec cp {} dist/ \; 2>/dev/null || true
          find . -name "*.txt" -exec cp {} dist/ \; 2>/dev/null || true

          # Copy Netlify security headers file
          cp _headers dist/ 2>/dev/null || true

      - name: Upload Fresh Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fresh-client-wasm-bundle
          path: dist
          if-no-files-found: error

