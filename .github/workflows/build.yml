name: Build Fresh Client WASM Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build WASM Target
        run: ./gradlew :target_teavm_wasm_gc:teavm -x test

      - name: Bundle Required Runtime Assets
        run: |
          cp _headers target_teavm_wasm_gc/javascript_dist/ 2>/dev/null || true
          find . -name "assets.epk" -exec cp {} target_teavm_wasm_gc/javascript_dist/ \; 2>/dev/null || true
          find . -name "eagruntime.js" -exec cp {} target_teavm_wasm_gc/javascript_dist/ \; 2>/dev/null || true

      - name: Upload Fresh Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fresh-client-wasm-bundle
          path: target_teavm_wasm_gc/javascript_dist
          if-no-files-found: warn

