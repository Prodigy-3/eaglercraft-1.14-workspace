name: Build Fresh Client WASM Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build WASM-GC Client & Assets
        run: ./gradlew :target_teavm_wasm_gc:teavm -x test

      - name: Bundle Build Artifacts
        run: |
          mkdir -p dist

          # Copy compiled TeaVM output files from target directory
          if [ -d "target_teavm_wasm_gc/javascript_dist" ]; then
            cp -r target_teavm_wasm_gc/javascript_dist/* dist/
          elif [ -d "target_teavm_wasm_gc/javascript" ]; then
            cp -r target_teavm_wasm_gc/javascript/* dist/
          fi

          # Copy assets generated into workspace root or build directories
          find target_teavm_wasm_gc -name "assets.epk" -exec cp {} dist/ \; 2>/dev/null || true
          find target_teavm_wasm_gc -name "assets.epw" -exec cp {} dist/ \; 2>/dev/null || true
          find . -maxdepth 2 -name "assets.epk" -exec cp {} dist/ \; 2>/dev/null || true
          find . -maxdepth 2 -name "assets.epw" -exec cp {} dist/ \; 2>/dev/null || true

          # Copy security headers
          cp _headers dist/ 2>/dev/null || true

      - name: Upload Fresh Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fresh-client-wasm-bundle
          path: dist
          if-no-files-found: error

