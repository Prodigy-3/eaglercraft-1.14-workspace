name: Build Fresh Client WASM Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build WASM Target
        run: ./gradlew :target_teavm_wasm_gc:teavm -x test

      - name: Bundle Build Artifacts
        run: |
          mkdir -p dist
          # Copy TeaVM output files into dist
          cp -r target_teavm_wasm_gc/javascript_dist/* dist/ 2>/dev/null || true
          cp -r target_teavm_wasm_gc/javascript/* dist/ 2>/dev/null || true
          cp -r javascript_dist/* dist/ 2>/dev/null || true
          cp -r javascript/* dist/ 2>/dev/null || true
          
          # Copy _headers and asset files into dist
          cp _headers dist/ 2>/dev/null || true
          find . -maxdepth 3 -name "assets.epk" -exec cp {} dist/ \; 2>/dev/null || true
          find . -maxdepth 3 -name "eagruntime.js" -exec cp {} dist/ \; 2>/dev/null || true

      - name: Upload Fresh Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fresh-client-wasm-bundle
          path: dist
          if-no-files-found: error

