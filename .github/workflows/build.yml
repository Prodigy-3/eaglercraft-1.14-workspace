name: Build Fresh Client WASM Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build WASM-GC Client & EPW Assets
        run: ./gradlew :target_teavm_wasm_gc:makeMainWasmClientBundle -x test || ./gradlew :target_teavm_wasm_gc:teavm -x test

      - name: Bundle Build Artifacts
        run: |
          mkdir -p dist
          
          # Copy outputs from TeaVM WASM distribution directory
          if [ -d "target_teavm_wasm_gc/javascript_dist" ]; then
            cp -r target_teavm_wasm_gc/javascript_dist/* dist/
          elif [ -d "target_teavm_wasm_gc/javascript" ]; then
            cp -r target_teavm_wasm_gc/javascript/* dist/
          fi
          
          # Copy headers file for Netlify cross-origin policies
          cp _headers dist/ 2>/dev/null || true
          
          # Collect any EPW or EPK asset files built elsewhere
          find . -name "*.epw" -exec cp {} dist/ \; 2>/dev/null || true
          find . -name "*.epk" -exec cp {} dist/ \; 2>/dev/null || true

      - name: Upload Fresh Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fresh-client-wasm-bundle
          path: dist
          if-no-files-found: error

