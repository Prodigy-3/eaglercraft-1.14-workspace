name: Build Fresh Client WASM Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build WASM Target & EPK Assets
        run: ./gradlew :target_teavm_wasm_gc:teavm build -x test

      - name: Bundle Build Artifacts
        run: |
          mkdir -p dist
          
          # Copy TeaVM compiled JavaScript & WASM files
          find . -type f \( -name "index.html" -o -name "*.wasm" -o -name "*.js" -o -name "*.png" -o -name "*.html" -o -name "*.txt" \) -exec cp {} dist/ \; 2>/dev/null || true
          
          # Copy headers and assets
          cp _headers dist/ 2>/dev/null || true
          find . -name "assets.epk" -exec cp {} dist/ \; 2>/dev/null || true
          find . -name "eagruntime.js" -exec cp {} dist/ \; 2>/dev/null || true

      - name: Upload Fresh Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fresh-client-wasm-bundle
          path: dist
          if-no-files-found: error

