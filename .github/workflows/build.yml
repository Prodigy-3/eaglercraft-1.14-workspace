name: Build Eaglercraft WASM Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Ensure output directory exists
        run: mkdir -p target_teavm_wasm_gc/javascript_dist

      - name: Compile TeaVM WASM Client
        run: ./gradlew :target_teavm_wasm_gc:teavmCompileClient

      - name: Build WASM Bundle
        run: ./gradlew :target_teavm_wasm_gc:makeMainWasmClientBundle

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-wasm-bundle
          path: target_teavm_wasm_gc/javascript_dist

